:root{--ink:#111;--rail:#d5d8dd;color-scheme:light}
html[data-theme="dark"]{--ink:#f0f1f3;--rail:#41444a;color-scheme:dark;background:#0f1012;color:#edf0f4}
html[data-theme="dark"] body{background:#0f1012;color:#edf0f4}
html[data-theme="dark"] .app,html[data-theme="dark"] nav{background:#17181c}
html[data-theme="dark"] .sheet{background:#202126}
html[data-theme="dark"] .list-row,html[data-theme="dark"] .mini,html[data-theme="dark"] .action,html[data-theme="dark"] .pill{background:#292b31;color:#e8ebf0;border-color:#36383f}
html[data-theme="dark"] .field input,html[data-theme="dark"] .field select{background:#292b31;color:#edf0f4;border-color:#41444b}
html[data-theme="dark"] .primary,html[data-theme="dark"] .pause{background:#eeeeef;color:#151619}
html[data-theme="dark"] nav button.selected,html[data-theme="dark"] .liked,html[data-theme="dark"] .lyric-box p.active{color:#f4f5f7}
html[data-theme="dark"] nav button.selected:after,html[data-theme="dark"] .dots i.on{background:#f4f5f7}
html[data-theme="dark"] .row,html[data-theme="dark"] .trace-identity,html[data-theme="dark"] .footer-rule{border-color:#36383f}
html[data-theme="dark"] .avatars img{border-color:#17181c}
html[data-theme="dark"] .lyric-box p{color:#777c85}
html[data-theme="dark"] .event .event-dot{color:#d8dce2;border-color:#484c54}
html[data-theme="dark"] .banner-play{color:#111}
html[data-theme="dark"] .sub,html[data-theme="dark"] .muted,html[data-theme="dark"] .status-line,html[data-theme="dark"] .artist,html[data-theme="dark"] .tiny,html[data-theme="dark"] .times{color:#a0a5af}

 async runSharedAdd(action,grant){requireLogin();if(!grant.valid()||S.epoch!==grant.epoch||action.type!=='add'||String(action.songId)!==String(grant.songId))throw Error('分享歌曲操作已失效');const p=S.profiles.find(p=>p.id===String(grant.space));if(!p)throw Error('此角色没有授权歌单');const role=action.playlistRole;if(role&&!['exclusive','common'].includes(role))throw Error('歌单类型无效');const roleId=role==='exclusive'?p.exclusivePid:role==='common'?p.defaultPid:'';if(role&&(!roleId||action.playlistId&&String(action.playlistId)!==String(roleId)))throw Error('歌单类型和编号不一致');const pid=String(action.playlistId||roleId||p.defaultPid||'');const allowed=()=>{const latest=S.profiles.find(x=>x.id===String(grant.space));return grant.valid()&&S.epoch===grant.epoch&&grant.permissions.some(x=>x.id===pid)&&playlistPermissions(latest,latest?.items.find(x=>String(x.pid)===pid)).add===true;};if(!allowed())throw Error('此歌单没有加歌授权');const cap=await api('bind',{pid,space:grant.space,actor:'char',permissions:{add:true,remove:false}});check(cap.result);if(!allowed())throw Error('分享或歌单授权已变化');const result=await read('add',{target:cap.target,space:grant.space,actor:'char',id:grant.songId});return {ok:true,result,playlist:p.items.find(x=>String(x.pid)===pid)?.name||pid};},
 restoreStorage(values){let changed=false;for(const [key,value]of Object.entries(values)){if(!key.startsWith('yiting.'))continue;const next=JSON.stringify(value);if(localStorage.getItem(key)!==next){localStorage.setItem(key,next);changed=true;}}if(changed){gallerySlots=load('yiting.builtin24.slots',{next:0,items:{}});storageLoad();}},
 syncProfiles,
 async lyrics(signal){const song=now(),owner=S.activeId;if(!song||!owner)throw Error('当前没有一起听的歌曲');const id=String(song.id);let raw=lyricCache.get(id);if(!raw){const d=await api('lyric',{id},signal);check(d.result);raw=String(d.result?.lrc?.lyric||'');if(raw)lyricCache.set(id,raw);}if(S.activeId!==owner||String(now()?.id)!==id)throw Error('已切换歌曲或结束一起听');let lines=parseLyrics(raw);if(!lines.length)lines=raw.split(/\r?\n/).filter(l=>l.trim()&&!/^\[[a-z]+:/i.test(l)).map(text=>({time:null,text:text.trim()}));return {name:song.name,artist:artist(song),songId:id,position:audio.currentTime||0,lines};},
 appTheme(){render();},
 select(id){if(S.activeId&&S.activeId!==id){toast('正在与另一位角色一起听');return;}if(S.profiles.some(p=>p.id===id))S.profileId=id;render();},
 accept(id){window.UwUMusic.acceptInvitation(id);notifyHost();},
 end(){endTogether();},
 identity(id){const p=S.profiles.find(p=>p.id===id);return p?{charAvatar:p.charAvatar,userAvatar:p.userAvatar}:{};},
 snapshot(){const p=profile();return {queue:{total:S.queue.length,remaining:Math.max(0,S.queue.length-S.index-1),...radioQueue.state()},activeCharId:S.activeId,song:now()?cleanSong(now()):null,changes:window.UwUMusicActions?.recent(S.activeId)||[],recentlyPlayed:S.events.filter(e=>e.profile===S.activeId&&e.type==='play').slice(0,8).map(e=>({text:e.text,who:e.who})),paused:audio.paused,playing:!audio.paused&&!audio.ended&&audio.readyState>=3,pending:radioQueue.pendingSongs().filter(s=>String(s.id)!==String(now()?.id)).map(s=>({id:String(s.id),name:s.name,artist:artist(s)})),candidates:S.queue.slice(Math.max(0,S.index),Math.max(0,S.index)+5).map(s=>({id:String(s.id),name:s.name,artist:artist(s)})),permissions:[...(p?.items||[])].sort((a,b)=>Number(playlistRole(p,b.pid)!=='linked')-Number(playlistRole(p,a.pid)!=='linked')).map(x=>({id:x.pid,name:x.name,role:playlistRole(p,x.pid),...playlistPermissions(p,x)}))};},
 toggle:togglePlay,
 async runCharAction(action){
  if(action._valid&&!action._valid())throw Error('音乐操作已取消');
  if(!S.activeId)throw Error('一起听未开启');
  if(action.type==='pause'){audio.pause();activity((profile()?.charName||'对方')+'暂停了播放','pause','char');render();notifyHost();return {ok:true};}
  if(action.type==='resume'){if(!now()||!audio.src)throw Error('尚未选择可播放歌曲');await audio.play();activity((profile()?.charName||'对方')+'继续播放','play','char');render();notifyHost();return {ok:true};}
  if(action.type==='remove_queue'){
   const ids=action.songIds||(action.songId?[action.songId]:[]);if(!Array.isArray(ids)||!ids.length||ids.length>12)throw Error('每次移除1至12首待播歌曲');
   const wanted=new Set(ids.map(String)),current=now(),pending=radioQueue.pendingSongs().filter(s=>String(s.id)!==String(current?.id));
   if([...wanted].some(id=>!pending.some(s=>String(s.id)===id)))throw Error('歌曲不在当前待播中');
   const removed=pending.filter(s=>wanted.has(String(s.id)));S.queue=S.queue.filter(s=>!wanted.has(String(s.id)));S.index=S.queue.findIndex(s=>String(s.id)===String(current?.id));
   radioQueue.state();UwUMusicActions.record(removed,'char',S.activeId,'queue','remove',null,'removed');render();notifyHost();return {ok:true,removed:removed.map(s=>String(s.id))};
  }
  const session=S.activeId;const result=await window.UwUMusic.runCharAction(action);if(S.activeId!==session)throw Error('一起听已变化');notifyHost();if(['play','next'].includes(action.type)&&audio.paused)throw Error('音源已就绪，但浏览器需要你点击播放');return result;
 }
};
for(const event of ['play','playing','pause','ended','error','emptied','waiting','stalled','seeking','seeked'])audio.addEventListener(event,()=>notifyHost());
setInterval(()=>{if(S.activeId)notifyHost();},1000);
if(host()){const values=host().restoreStorage();window.UwUBridge.restoreStorage(values);}
void restoreLogin();
